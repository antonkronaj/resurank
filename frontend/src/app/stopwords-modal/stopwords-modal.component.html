<app-modal-shell (close)="close.emit()" [isOpen]="isOpen()" title="Exclusion words">

  <p class="text-muted small">
    Words to ignore when scoring. These get filtered out of both the resume
    and the pasted job description before matching. Type and press <b>Enter</b>
    to add, or paste a comma/space-separated list.
  </p>

  @if (saving()) {
    <div class="saving-banner">
      <span class="spinner"></span>
      Saving exclusion words…
    </div>
  }

  <div class="input-container">
    <textarea
      (ngModelChange)="draft.set($event)"
      [disabled]="saving()"
      [ngModel]="draft()"
      class="words-textarea"
      placeholder="e.g. experience, work, team…"></textarea>
  </div>

  <div class="word-count text-muted small">
    Comma separated words
  </div>

  <ng-container modal-footer>
    <input #fileInput (change)="onImportFile($event)" accept=".txt,text/plain" hidden type="file"/>
    <button (click)="fileInput.click()" [disabled]="saving()" class="file-btn" type="button">Import from file</button>
    <button (click)="exportToArray()" [disabled]="saving() || !draft()" class="file-btn" type="button">Export Array
    </button>
    <div style="flex: 1"></div>
    <button (click)="close.emit()" [disabled]="saving()" class="file-btn" type="button">Cancel</button>
    <button (click)="onSave()" [disabled]="saving()" class="primary sm" type="button">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
  </ng-container>

</app-modal-shell>
