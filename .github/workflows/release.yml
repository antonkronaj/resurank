name: Release

on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
      - '!renovate/**'
    tags:
      - 'v*'         # Electron app release (e.g. v0.4.0)
      - 'mcp-v*'     # resurank-mcp DXT release (e.g. mcp-v1.0.0)

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=12288

jobs:
  release:
    # Skip on library-only tags. Branch pushes and v* tags still run.
    if: ${{ !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm and electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'apps/ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Configure Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, "$env:LOCALAPPDATA\electron")) {
            Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue
          }

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund --prefer-offline
          npm --prefix apps/ui install --no-audit --no-fund --prefer-offline

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          echo "$CSC_LINK" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm certificate.p12

      - name: Make & generate manifests (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_NAME: ${{ secrets.APPLE_ID_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Sign + notarize only on v* tag pushes. Branch pushes produce an
          # unsigned .dmg for verification; forge.config.cjs respects
          # SKIP_SIGNING=1 by omitting osxSign/osxNotarize from packagerConfig.
          SKIP_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
        run: npm run dist

      - name: Make & generate manifests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: npm run dist

      - name: Pre-stage app for Windows packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Build at the project root so dist/ and apps/ui/dist/ are populated.
          npm run build

          $stage = Join-Path $env:RUNNER_TEMP 'app-stage'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          foreach ($d in 'dist','resources') {
            if (Test-Path $d) { Copy-Item -Recurse -Path $d -Destination $stage }
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'apps/ui') | Out-Null
          if (Test-Path 'apps/ui/dist') {
            Copy-Item -Recurse -Path 'apps/ui/dist' -Destination (Join-Path $stage 'apps/ui/dist')
          }
          if (Test-Path 'app-update.yml') { Copy-Item -Path 'app-update.yml' -Destination $stage }

          # Forge will run from inside the stage, so it needs its config (and
          # any signing entitlements) present at the new cwd.
          Copy-Item -Path 'forge.config.cjs' -Destination $stage
          if (Test-Path 'entitlements.plist') { Copy-Item -Path 'entitlements.plist' -Destination $stage }

          # Slim package.json: drop workspaces so the stage install doesn't
          # try to resolve apps/ui/shared. Keep devDependencies — forge
          # itself runs inside the stage and needs @electron-forge/cli, the
          # makers, plugin-fuses, @electron/fuses, and electron.
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.PSObject.Properties.Remove('workspaces')
          $pkg | ConvertTo-Json -Depth 100 | Set-Content (Join-Path $stage 'package.json') -Encoding utf8

          Push-Location $stage
          npm install --no-audit --no-fund --no-package-lock --prefer-offline
          Pop-Location

          "STAGE_DIR=$stage" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Make & generate manifests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        run: |
          $rootDir = $PWD.Path
          Push-Location $env:STAGE_DIR
          try {
            npm run dist
            $forgeExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($forgeExit -ne 0) { exit $forgeExit }

          # Move staged out/ to the repo root so the publish step finds it.
          $stagedOut = Join-Path $env:STAGE_DIR 'out'
          $rootOut = Join-Path $rootDir 'out'
          if (Test-Path $stagedOut) {
            if (Test-Path $rootOut) { Remove-Item -Recurse -Force $rootOut }
            Move-Item -Path $stagedOut -Destination $rootOut
          }

      - name: Publish to GitHub Releases
        if: always() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag || true
          find out/make \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" -o -name "*.yml" -o -name "*.nupkg" -o -name "RELEASES" \) -print0 \
            | xargs -0 gh release upload "$TAG" --clobber
