name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'test'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=12288

jobs:
  release:
    strategy:
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm and electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Configure Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @(
            $env:GITHUB_WORKSPACE,
            $env:RUNNER_TEMP,
            "$env:LOCALAPPDATA\electron",
            "$env:LOCALAPPDATA\electron-builder",
            "$env:APPDATA\npm-cache"
          )
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "excluded $p"
            } catch {
              Write-Host "could not exclude $p - $_"
            }
          }
          Write-Host "==active Defender ExclusionPath entries=="
          (Get-MpPreference).ExclusionPath | ForEach-Object { Write-Host "  $_" }

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund --prefer-offline
          npm --prefix frontend install --no-audit --no-fund --prefer-offline

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          echo "$CSC_LINK" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm certificate.p12

      - name: Make & generate manifests (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_NAME: ${{ secrets.APPLE_ID_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run dist

      - name: Make & generate manifests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: npm run dist

      - name: Pre-stage app for Windows packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Build first so dist/ and frontend/dist/ are populated.
          npm run build

          $stage = Join-Path $env:RUNNER_TEMP 'app-stage'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          foreach ($d in 'dist','resources') {
            if (Test-Path $d) { Copy-Item -Recurse -Path $d -Destination $stage }
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'frontend') | Out-Null
          if (Test-Path 'frontend/dist') {
            Copy-Item -Recurse -Path 'frontend/dist' -Destination (Join-Path $stage 'frontend/dist')
          }
          if (Test-Path 'app-update.yml') { Copy-Item -Path 'app-update.yml' -Destination $stage }

          # Forge will run from inside the stage, so it needs its config and
          # any signing entitlements present at the new cwd.
          Copy-Item -Path 'forge.config.cjs' -Destination $stage
          if (Test-Path 'entitlements.plist') { Copy-Item -Path 'entitlements.plist' -Destination $stage }

          # Slim package.json: drop workspaces so the stage's npm install
          # doesn't resolve frontend/shared. Keep devDependencies — forge runs
          # inside the stage and needs @electron-forge/cli, the makers,
          # plugin-fuses, @electron/fuses, electron, etc.
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.PSObject.Properties.Remove('workspaces')
          $pkg | ConvertTo-Json -Depth 100 | Set-Content (Join-Path $stage 'package.json') -Encoding utf8

          Push-Location $stage
          npm install --no-audit --no-fund --no-package-lock --prefer-offline
          Pop-Location

          "STAGE_DIR=$stage" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          $count = (Get-ChildItem -Recurse $stage -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "stage ready at $stage with $count entries"

      - name: Make & generate manifests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        env:
          DEBUG: 'electron-*'
          ELECTRON_FORGE_LISTR_RENDERER: verbose
          DEBUG_COLORS: '0'
        run: |
          $ErrorActionPreference = 'Continue'
          $rootDir = $PWD.Path
          $stage = $env:STAGE_DIR
          if (-not $stage) { throw "STAGE_DIR not set — pre-stage step did not run" }
          Write-Host "rootDir=$rootDir stage=$stage"

          # Watchdog + tee'd logs live at the repo root so the upload step
          # finds them at known paths regardless of where forge runs.
          $watchdogScript = Join-Path $rootDir 'watchdog.ps1'
          @'
          param([string]$LogPath)
          while ($true) {
            try {
              "==WATCHDOG== $((Get-Date).ToString('s'))" | Out-File -FilePath $LogPath -Append -Encoding utf8
              Get-Process -ErrorAction SilentlyContinue |
                Where-Object { $_.ProcessName -match '^(node|electron|Squirrel|signtool|7z|nuget|cmd|pwsh|powershell)' } |
                Format-Table Id, ProcessName, @{Name='CPU'; Expression={[math]::Round($_.CPU, 1)}}, @{Name='WS_MB'; Expression={[math]::Round($_.WorkingSet64/1MB, 1)}} -AutoSize |
                Out-String -Width 200 |
                Out-File -FilePath $LogPath -Append -Encoding utf8
            } catch { "watchdog error: $_" | Out-File -FilePath $LogPath -Append -Encoding utf8 }
            Start-Sleep -Seconds 15
          }
          '@ | Set-Content -Path $watchdogScript -Encoding utf8

          $watchdogLog = Join-Path $rootDir 'watchdog.log'
          $distLog = Join-Path $rootDir 'dist.log'
          $watchdog = Start-Process pwsh -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$watchdogScript,'-LogPath',$watchdogLog -PassThru -WindowStyle Hidden
          Write-Host "watchdog pid=$($watchdog.Id) -> $watchdogLog"

          try {
            # Run forge from inside the stage so process.cwd() (which forge
            # uses to set packager opts.dir) is the small staged tree.
            Push-Location $stage
            try {
              Write-Host "::group::electron-forge package (cwd=$stage)"
              npm run package 2>&1 | Tee-Object -FilePath $distLog -Append
              $packageExit = $LASTEXITCODE
              Write-Host "::endgroup::"
              Write-Host "==electron-forge package exit=$packageExit=="
              if ($packageExit -ne 0) { exit $packageExit }

              Write-Host "::group::electron-forge make --skip-package (cwd=$stage)"
              npm run make -- --skip-package 2>&1 | Tee-Object -FilePath $distLog -Append
              $makeExit = $LASTEXITCODE
              Write-Host "::endgroup::"
              Write-Host "==electron-forge make exit=$makeExit=="
              if ($makeExit -ne 0) { exit $makeExit }
            } finally {
              Pop-Location
            }

            # Move the staged out/ to the repo root so the upload + publish
            # steps find the artifacts at their expected location.
            $stagedOut = Join-Path $stage 'out'
            $rootOut = Join-Path $rootDir 'out'
            if (Test-Path $stagedOut) {
              if (Test-Path $rootOut) { Remove-Item -Recurse -Force $rootOut }
              Move-Item -Path $stagedOut -Destination $rootOut
              Write-Host "moved $stagedOut -> $rootOut"
            } else {
              Write-Host "warning: $stagedOut not found"
            }
          } finally {
            Stop-Process -Id $watchdog.Id -ErrorAction SilentlyContinue
          }

      - name: Snapshot Windows build state
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          # electron-packager writes to the user's local Temp, not $RUNNER_TEMP
          $packagerTemp = Join-Path $env:LOCALAPPDATA 'Temp\electron-packager'
          Write-Host "scanning $packagerTemp"
          Get-ChildItem -Recurse -Path $packagerTemp -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize |
            Out-String -Width 300 |
            Out-File temp-tree.txt -Encoding utf8
          Write-Host "==tail of dist.log=="
          if (Test-Path dist.log) { Get-Content dist.log -Tail 100 } else { Write-Host "dist.log not found" }
          Write-Host "==tail of watchdog.log=="
          if (Test-Path watchdog.log) { Get-Content watchdog.log -Tail 80 } else { Write-Host "watchdog.log not found" }

      - name: Upload Windows build diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-debug-${{ github.run_id }}
          path: |
            out/
            dist.log
            watchdog.log
            watchdog.ps1
            temp-tree.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish to GitHub Releases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag || true
          find out/make \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" -o -name "*.yml" \) -print0 \
            | xargs -0 gh release upload "$TAG" --clobber
