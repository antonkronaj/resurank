name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'test'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=12288

jobs:
  release:
    strategy:
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm --prefix frontend install

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          echo "$CSC_LINK" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm certificate.p12

      - name: Make & generate manifests (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_NAME: ${{ secrets.APPLE_ID_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run dist

      - name: Make & generate manifests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: npm run dist

      - name: Make & generate manifests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 45
        env:
          DEBUG: 'electron-forge:*,electron-packager:*,electron-winstaller:*'
          ELECTRON_FORGE_LISTR_RENDERER: verbose
          DEBUG_COLORS: '0'
        run: npm run dist

      - name: Upload Windows build diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-debug-${{ github.run_id }}
          path: |
            out/
            package-manifest.txt
            ${{ runner.temp }}/electron-packager/**/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish to GitHub Releases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag || true
          find out/make \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" -o -name "*.yml" \) -print0 \
            | xargs -0 gh release upload "$TAG" --clobber
