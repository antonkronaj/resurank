<div class="auth-wrap">
  <aside class="auth-brand">
    <div class="brand"><span class="brand-mark">R</span> ResuRank</div>
    <div>
      <h1 class="auth-head">Reset link, <em>one</em> use, short life.</h1>
      <p class="auth-sub">Tokens expire quickly and can only be redeemed once.</p>
    </div>
    <span></span>
  </aside>
  <main class="auth-form">
    <div class="auth-card">
      <h2 class="auth-title">Forgot your password?</h2>

      @if (sent()) {
        <p class="auth-lede">
          If an account exists for that address, a reset link is on its way.
        </p>
      } @else {
        <p class="auth-lede">Enter your email and we will send a reset link.</p>
        <form (ngSubmit)="onSubmit()">
          <label class="field">
            <span class="field-label">Email</span>
            <input class="input" type="email" name="email" required placeholder="you@example.com" [ngModel]="email()" (ngModelChange)="email.set($event)" autocomplete="email">
          </label>
          <button class="primary" type="submit" style="width:100%" [disabled]="submitting()">
            {{ submitting() ? 'Sending…' : 'Send reset link' }}
          </button>
        </form>
      }

      <p class="auth-foot">
        <a class="link" routerLink="/login">Back to sign in</a>
      </p>
    </div>
  </main>
</div>
