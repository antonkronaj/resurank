<div class="app-shell">
  <header class="toolbar">
    <a class="brand" routerLink="score"><span class="brand-mark">R</span> ResuRank</a>
    <nav class="nav">
      <a routerLink="score" routerLinkActive="active">Score</a>
      <a routerLink="resumes" routerLinkActive="active">Resumes</a>
      <a routerLink="history" routerLinkActive="active">History</a>
    </nav>
    <span class="flex1"></span>
    <div class="avatar-wrap">
      <button (click)="toggleMenu()" class="avatar" title="Account" type="button">{{ initials() }}</button>
      @if (menuOpen()) {
        <div (click)="closeMenu()" class="menu-backdrop"></div>
        <div class="avatar-menu">
          <a (click)="closeMenu()" class="avatar-menu-item" routerLink="account">Account</a>
          <a (click)="closeMenu()" class="avatar-menu-item" routerLink="settings">Settings</a>
          <button (click)="toggleTheme()" class="avatar-menu-item" type="button">
            {{ theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode' }}
          </button>
          <button (click)="signOut()" class="avatar-menu-item" type="button">Sign out</button>
        </div>
      }
    </div>
  </header>

  <router-outlet />

  <!-- Legal links live here rather than in the avatar menu, which is for
       account actions. Kept as `target="_blank"` (their pre-move behaviour)
       so reading them never costs you an in-progress score. -->
  <footer class="app-footer">
    <a class="app-footer-link" href="/terms" rel="noopener" target="_blank">Terms</a>
    <span aria-hidden="true">·</span>
    <a class="app-footer-link" href="/privacy" rel="noopener" target="_blank">Privacy</a>
  </footer>
</div>

<div class="min-width-guard">
  <p class="min-width-guard-text">
    ResuRank works best on a larger screen. Please widen your browser window or switch to a
    bigger display — full mobile support is coming soon.
  </p>
</div>
